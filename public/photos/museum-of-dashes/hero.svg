<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f9f8f6"/>

  <!-- Border frame -->
  <rect x="60" y="60" width="1080" height="510" fill="none" stroke="#262422" stroke-width="8"/>
  <rect x="70" y="70" width="1060" height="490" fill="none" stroke="#262422" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="200" font-family="Georgia, serif" font-size="72" font-weight="900" text-anchor="middle" fill="#262422" letter-spacing="8">THE MUSEUM</text>
  <text x="600" y="280" font-family="Georgia, serif" font-size="48" text-anchor="middle" fill="#3d3a36" letter-spacing="4">of Dashes</text>

  <!-- Specimen examples -->
  <text x="300" y="420" font-family="Georgia, serif" font-size="96" fill="#262422">—</text>
  <text x="450" y="420" font-family="Georgia, serif" font-size="96" fill="#262422">–</text>
  <text x="600" y="420" font-family="Georgia, serif" font-size="96" fill="#262422">−</text>
  <text x="750" y="420" font-family="Georgia, serif" font-size="96" fill="#262422">_</text>
  <text x="900" y="420" font-family="Georgia, serif" font-size="96" fill="#262422">|</text>

  <!-- Subtitle -->
  <text x="600" y="500" font-family="Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#3d3a36" letter-spacing="6">DEPARTMENT OF TYPOGRAPHIC ENTOMOLOGY</text>
</svg>

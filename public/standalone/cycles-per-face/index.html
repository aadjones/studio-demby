<!doctype html>
<html lang="en" data-web>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cycles per Face</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100dvh; overflow: hidden; background: #100e0d; }
  [hidden] { display: none !important; }

  /* Canvas and overlay share one grid cell, both centered on the stage. */
  .stage { height: 100dvh; display: grid; place-items: center; }
  .sweep-canvas, .overlay { grid-area: 1 / 1; }
  .sweep-canvas { display: block; transition: opacity 2s; } /* 2s = FADE_SECONDS in installation.ts */
  .sweep-canvas.fading { opacity: 0; }
  .overlay { position: relative; width: 100%; height: 100%; display: grid; place-items: center; }

  /* Small text at the bottom of the wall, legible over any painting. */
  .attract-hint, .keep-note {
    position: absolute; bottom: 4dvh; font: 2.6dvh system-ui, sans-serif;
    color: rgba(255, 255, 255, 0.8); text-shadow: 0 0 1dvh rgba(0, 0, 0, 0.9);
  }
  .attract-hint { left: 0; right: 0; text-align: center; }
  .keep-note { right: 3dvh; font-size: 1.8dvh; }

  /* The panel takes the video's exact shape, so guide percentages are photo fractions. */
  /* The video sets the size: 80dvh tall, or 95vw wide if that's smaller (a phone held
     upright). --aspect is the camera's width/height, set once it plays. */
  .capture-panel { position: relative; color: #ddd; font: 2dvh system-ui, sans-serif; }
  .camera-view { display: block; width: min(95vw, calc(80dvh * var(--aspect, 1.7778))); transform: scaleX(-1); }
  .face-guide {
    position: absolute; height: 55%; aspect-ratio: 3 / 4; transform: translate(-50%, -50%);
    border: 0.4dvh solid rgba(255, 255, 255, 0.7); border-radius: 50%;
  }
  .ready-prompt {
    position: absolute; left: 0; right: 0; bottom: 4%; text-align: center;
    font: 500 4dvh system-ui, sans-serif; color: #fff; text-shadow: 0 0 1dvh rgba(0, 0, 0, 0.9);
  }
  .countdown {
    position: absolute; inset: 0; display: grid; place-items: center;
    font: 600 30dvh/1 system-ui, sans-serif; color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 0 2dvh rgba(0, 0, 0, 0.9);
  }

  /* A camera-flash blink at the snap: the visitor knows the photo was taken. */
  .snap-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .snap-flash.on { animation: snap-flash 0.6s ease-in; }
  @keyframes snap-flash { 0%, 20% { opacity: 1; } 100% { opacity: 0; } }

  /* Admin panel (backtick): full width on a narrow screen, a drawer on the right from 768px. */
  .admin-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 100%; box-sizing: border-box;
    display: flex; flex-direction: column; z-index: 10;
    background: rgba(24, 22, 21, 0.96); color: #ddd; border-left: 1px solid #333;
    font: 13px/1.4 ui-monospace, Menlo, monospace;
  }
  @media (min-width: 768px) { .admin-panel { width: 520px; } }
  .admin-header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 12px 16px; border-bottom: 1px solid #333;
  }
  .admin-title { font-weight: 600; margin-right: auto; }
  .admin-status { flex-basis: 100%; color: #c9934a; min-height: 1em; }
  .admin-button, .admin-select, .admin-number {
    font: inherit; color: #eee; background: #2a2725; border: 1px solid #444; border-radius: 6px; padding: 4px 10px;
  }
  .admin-button { cursor: pointer; }
  .admin-button:hover { background: #3a3633; }
  .admin-number { width: 5.5em; padding: 4px 6px; }
  .admin-sections { overflow-y: auto; padding: 4px 16px 24px; }
  .admin-section { border-bottom: 1px solid #2c2a28; padding: 8px 0; }
  .admin-section-title { cursor: pointer; font-weight: 600; color: #aaa; padding: 4px 0; }
  .admin-section-body { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
  .admin-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .admin-row-label { color: #aaa; }
  .admin-slider { display: flex; align-items: center; gap: 8px; }
  .admin-slider-value { width: 3.5em; text-align: right; }
  .admin-pair { display: flex; gap: 6px; }
  .admin-voices { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .admin-voices > * { align-self: stretch; }
  .admin-voices > .admin-button { align-self: flex-start; }

  .mask-head { display: flex; justify-content: space-between; }
  .mask-readout { color: #888; }
  .mask-graph { display: block; width: 100%; height: auto; touch-action: none; user-select: none; }
  .mask-graph .axis { stroke: #555; }
  .mask-graph .face-line { stroke: #777; stroke-dasharray: 3 3; }
  .mask-graph .tick { fill: #777; font-size: 9px; }
  .mask-graph .point { cursor: grab; }
</style>
</head>
<body>
<div class="stage">
  <canvas class="sweep-canvas" hidden></canvas>
  <div class="overlay">
    <div class="attract-hint">Step up and press any key</div>
    <div class="keep-note" hidden>Finished images are being saved</div>
    <div class="capture-panel" hidden>
      <video class="camera-view" muted playsinline></video>
      <div class="face-guide"></div>
      <div class="ready-prompt" hidden>Put your face in the oval</div>
      <div class="countdown"></div>
    </div>
    <div class="snap-flash"></div>
  </div>
  <div class="admin-panel" hidden></div>
</div>
<script src="installation.js"></script>
</body>
</html>

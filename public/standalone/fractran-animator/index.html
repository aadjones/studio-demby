    <style>
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1f2937;
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6b7280;
      }
      
      .bead-enter {
        animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      
      .bead-exit {
        animation: shrinkOut 0.3s ease-in forwards;
      }
      
      @keyframes popIn {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes shrinkOut {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(0); opacity: 0; }
      }

      /* Range sliders: expand hit area and restore thumb lost by appearance-none */
      input[type="range"] { height: 1.5rem !important; cursor: pointer; background: transparent; }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 4px; border-radius: 2px; background: #374151;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px; height: 14px; border-radius: 50%;
        background: #3b82f6; cursor: pointer; margin-top: -5px;
      }
      input[type="range"]::-moz-range-track {
        height: 4px; border-radius: 2px; background: #374151;
      }
      input[type="range"]::-moz-range-thumb {
        width: 14px; height: 14px; border-radius: 50%;
        background: #3b82f6; cursor: pointer; border: none;
      }
    </style>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shatter</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <a href="/work/shatter" style="position:fixed;top:1rem;left:1rem;z-index:9999;font-family:monospace;font-size:0.7rem;letter-spacing:0.08em;text-decoration:none;color:#fff;mix-blend-mode:difference;opacity:0.6;">← portfolio</a>
    <!-- Crossfade overlay -->
    <div id="fade-overlay"></div>

    <!-- Showcase UI -->
    <div id="showcase-ui">
      <button id="make-own-btn">Make Your Own</button>
    </div>

    <!-- Creator UI -->
    <div id="creator-ui" class="hidden">
      <button id="back-btn">Back</button>
      <div class="slider-group">
        <label for="density-slider">Density</label>
        <input
          type="range"
          id="density-slider"
          min="200"
          max="8000"
          step="100"
          value="2000"
        />
      </div>
      <div class="slider-group">
        <label for="size-slider">Fragment Size</label>
        <input
          type="range"
          id="size-slider"
          min="10"
          max="500"
          step="5"
          value="150"
        />
      </div>
      <button id="shuffle-btn">Shuffle</button>
    </div>

    <main>
      <div id="canvas-container"></div>
    </main>
    <script src="sketch.js"></script>
  </body>
</html>

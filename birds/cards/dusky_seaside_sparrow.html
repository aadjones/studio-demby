
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

:root {
  --card-bg: #faf7f2;
  --ink: #1c1a16;
  --ink-light: #6b6660;
  --ink-faint: #a8a29e;
  --accent: #8b7355;
  --accent-faint: #c4b498;
  --voice1: #7a4419;
  --voice2: #5c6b3a;
  --voice3: #3a5c6b;
  --voice4: #5c3a6b;
}

@media (prefers-color-scheme: dark) {
  :root {
    --card-bg: #1a1816;
    --ink: #e4dfd6;
    --ink-light: #9c9688;
    --ink-faint: #5c5850;
    --accent: #a89070;
    --accent-faint: #5c5040;
    --voice1: #c08050;
    --voice2: #8ca060;
    --voice3: #60a0b0;
    --voice4: #a070b8;
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }

.card {
  width: 600px;
  margin: 0 auto;
  padding: 48px 56px 40px;
  background: var(--card-bg);
  font-family: 'EB Garamond', 'Cormorant Garamond', serif;
}

.rule {
  border: none;
  height: 1px;
  background: var(--accent-faint);
  margin: 0;
}

.rule-short {
  width: 80px;
  margin: 0 auto;
}

.bird-name {
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 32px;
  font-weight: 300;
  letter-spacing: 4px;
  color: var(--ink);
  margin: 28px 0 8px;
  text-transform: uppercase;
}

.species {
  text-align: center;
  font-family: 'EB Garamond', serif;
  font-size: 13px;
  font-style: italic;
  color: var(--ink-light);
  letter-spacing: 1px;
  margin-bottom: 28px;
}

.notation-area {
  display: flex;
  justify-content: center;
  margin: 32px 0 6px;
}

.notation-svg {
  color: var(--ink);
}

.chorale-label {
  text-align: center;
  font-family: 'EB Garamond', serif;
  font-size: 15px;
  font-style: italic;
  color: var(--ink-light);
  margin: 2px 0 36px;
  letter-spacing: 0.5px;
}

.mood {
  text-align: center;
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 300;
  font-style: italic;
  color: var(--ink-light);
  letter-spacing: 6px;
  margin: 28px 0;
}

.attribution {
  text-align: center;
  font-family: 'EB Garamond', serif;
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 2px;
  margin-top: 28px;
  text-transform: uppercase;
}
</style>
